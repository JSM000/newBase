name: Privacy check

# 인사기록카드가 지나가는 점수 계산기 코드에 서버 전송 로직이 섞여 들어오지 않았는지
# PR마다 확인한다. 근거: CLAUDE.md "개인정보 보호 원칙",
# scripts/check-no-network-in-score-calc.mjs.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check-privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # check-pii-detect.mjs 가 .ts 를 직접 import 한다 — Node 의 TypeScript 타입 제거 기능(22.6+) 필요
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/check-no-network-in-score-calc.mjs
      - run: node --no-warnings scripts/check-pii-detect.mjs
